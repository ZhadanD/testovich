<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>

    <link rel="stylesheet" href="/css/colors.css">
    <link rel="stylesheet" href="/css/commonStyles.css">
</head>
<body>
    <div class="container">
        <div th:insert="~{blocks/header}"></div>

        <main class="beautiful-form">
            <h1>Регистрация</h1>
            
            <label class="beautiful-label" for="username">Имя пользователя</label>
            <input type="text" class="beautiful-input" id="username" placeholder="Введите имя пользователя">
            <p id="error-username" class="error-text"></p>

            <br/>

            <label class="beautiful-label" for="password">Пароль</label>
            <input type="password" class="beautiful-input" id="password" placeholder="Введите пароль">
            <p id="error-password" class="error-text"></p>

            <br/>

            <label class="beautiful-label" for="repeat-password">Повторите пароль</label>
            <input type="password" class="beautiful-input" id="repeat-password" placeholder="Введите пароль еще раз">

            <br/>

            <p style="font-size: 20px;">Уже зареган? <a href="/auth/login" class="beautiful-link">Логинься</a>!</p>

            <br/>

            <button type="button" class="beautiful-btn" id="btnRegister" onclick="register()">
                Зарегаться
            </button>
        </main>
    </div>

    <script src="/js/header.js"></script>
    <script src="/js/authServiceInfo.js"></script>
    <script src="/js/errors.js"></script>
    <script src="/js/register.js"></script>
</body>
</html>
